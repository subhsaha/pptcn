name: Publish docs and component registry

on:
  push:
    branches: [main]
    paths:
      - "public/r/**"
      - "site/**"
      - "docs/previews/**"
      - "examples/financial-summary.pptx"
      - "registry.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p _site/r _site/assets
          cp site/index.html site/styles.css _site/
          cp public/r/*.json _site/r/
          cp docs/previews/*.png _site/assets/
          cp examples/financial-summary.pptx _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
